<div class="mt-2">
  <div class="row">
    <div class="col-md-8 offset-md-2">
      <form action="{% url 'job:job_list' %}" id="id_search_form"novalidate>
        <div class="row mb-3">
          <div class="col-md-4 class_skill">
            <input type="text" class="form-control" name="skills" id="id_search" placeholder="Type your skills, job title"autocomplete="off"required>
          </div>
          <div class="col-md-4 class_location">
            <input type="text" class="form-control" name="locations" id="id_location" placeholder="Type location, locality"autocomplete="off" value="Bangalore, Karnataka" disabled required>
          </div>
          <div class="col-md-4 class_submit">
            <input type="submit" class="btn w-100 submit_button btn-light"id="id_submit" value="Search">
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
