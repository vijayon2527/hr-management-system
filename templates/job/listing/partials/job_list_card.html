{% load humanize %}
{% for job in jobs %}
<div class="card mb-3">
    <div class="card-header">
        <a href="?job_title={{ job.slug }}" class="h4">{{ job.role }}</a>
    </div>
    <div class="card-body">
        <p class="card-text"><i class="fa-solid fa-bag-shopping"></i> {{ job.experience }}</p>
        <p class="card-text"><i class="fa-solid fa-location-dot"></i> {{ job.place }}</p>
        <p class="card-text"><i class="fa-solid fa-money-bill"></i> {{ job.get_salary }}</p>
        <p class="card-text">
            <i class="fa-solid fa-book"></i>
            {% for skill in job.get_all_skills %}
            <small>{{ skill }}, </small>
            {% endfor %}
        </p>
        <p class="card-text"><i class="fa-solid fa-clock"></i> {{ job.uploaded_at|timesince }} ago</p>
        <a href="?job_title={{ job.slug }}" class="btn btn-light btn-sm w-100">Details</a>
    </div>
</div>
{% empty %}
<p>No jobs found.</p>
{% endfor %}
