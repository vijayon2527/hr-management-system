{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Delete Quiz</h2>
  <p>Are you sure you want to delete <strong>{{ quiz.title }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <a href="{% url 'super_admin:super_admin_quiz_list' %}" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-danger">Delete</button>
  </form>
</div>
{% endblock %}
