<!-- script.html -->
<!-- jQuery and Toastr JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

<!-- Toastr Options -->
<script>
    toastr.options = {
        "closeButton": true,
        "progressBar": true,
        "positionClass": "toast-top-right",
        "timeOut": "5000",
        "extendedTimeOut": "2000",
    };
</script>

<!-- Django Messages with Toastr -->
{% if messages %}
<script>
    {% for message in messages %}
        {% if message.tags == "success" %}
            toastr.success("{{ message|escapejs }}", "Success");
        {% elif message.tags == "error" %}
            toastr.error("{{ message|escapejs }}", "Error");
        {% elif message.tags == "warning" %}
            toastr.warning("{{ message|escapejs }}", "Warning");
        {% elif message.tags == "info" %}
            toastr.info("{{ message|escapejs }}", "Info");
        {% else %}
            toastr.info("{{ message|escapejs }}");
        {% endif %}
    {% endfor %}
</script>
{% endif %}

<!-- Bootstrap and Bootbox JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
