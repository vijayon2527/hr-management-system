{% load static common_tags %}
<!-- Main Sidebar Container -->
<aside class="main-sidebar sidebar-dark-primary elevation-4">
    <!-- Brand Logo -->
    <a href="" class="brand-link">
      <img src="{% static 'images/brand_logo.png' %}" alt="AGP-HR Logo" class="brand-image img-circle elevation-3" style="opacity: .8">
      <span class="brand-text font-weight-light">AGPHR</span>
    </a>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Sidebar user panel (optional) -->
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image">
          <img src="{% static 'dashboard/dist/img/user2-160x160.jpg' %}" class="img-circle elevation-2" alt="User Image">
        </div>
        <div class="info">
          <a href="#" class="d-block">Application Hnadler</a>
        </div>
      </div>

      <!-- SidebarSearch Form -->
      <div class="form-inline">
        <div class="input-group" data-widget="sidebar-search">
          <input class="form-control form-control-sidebar" type="search" placeholder="Search" aria-label="Search">
          <div class="input-group-append">
            <button class="btn btn-sidebar">
              <i class="fas fa-search fa-fw"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Sidebar Menu -->
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item">
            <a href="#" class="nav-link
            {% is_active 'applicant_list' 'add_applicant' 'update_applicant' 'applicant_detail' %}"
            >
              <i class="nav-icon fas fa-envelope"></i>
              <p>
                Applicants
                <i class="right fas fa-angle-left"></i>
                <span class="badge badge-info right">2</span>
              </p>
            </a>
            <ul class="nav nav-treeview">
              <li class="nav-item">
                <a href="{% url 'application_handler:add_applicant' %}" 
                class="nav-link
                {% is_active 'add_applicant' %}"
                >
                  <i class="far fa-circle nav-icon"></i>
                  <p>Add Applicant</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="{% url 'application_handler:applicant_list' %}" 
                class="nav-link
                {% is_active 'applicant_list' 'applicant_detail' %}"
                >
                  <i class="far fa-circle nav-icon"></i>
                  <p>Applicant List</p>
                </a>
              </li>
            </ul>
          </li>
        </ul>
      </nav>
      <!-- /.sidebar-menu -->
    </div>
    <!-- /.sidebar -->
  </aside>
