{% extends 'dilip_dashboard_v2/dashboard_base.html' %}
{% load static %}

{% block css %}
<style>
  .error {
    color: red;
  }
</style>
{% endblock css %}

{% block content %}
<div class="content-wrapper">
  <div class="card-header card-header-primary">
    <h4 class="card-title" style="font-size: 20px;">Update Skill</h4>
  </div>
  <div class="card-body">
    <form action="." method="post" id="id_skill">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary"><span>Submit</span></button>
      <a href="{% url 'super_admin:super_admin_skill_list' %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}

{% block js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js" integrity="sha512-rstIgDs0xPgmG6RX1Aba4KV5cWJbAMcvRCVmglpam9SoHZiUCyQVDdH2LPlxoHtrv17XWblE/V/PP+Tr04hbtA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="{% static 'js/dashboard/validation.js' %}"></script>
{% endblock js %}
