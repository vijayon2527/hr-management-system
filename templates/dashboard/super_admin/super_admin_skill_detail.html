{% extends 'dilip_dashboard_v2/dashboard_base.html' %}
{% block content %}
<div class="content-wrapper">
    <div class="card-header card-header-primary">
        <h4 class="card-title" style="font-size: 20px; margin: 0;">Skill Details</h4>
        <a href="{% url 'super_admin:super_admin_skill_list' %}" class="btn btn-secondary mb-3 float-right">Back to Skill List</a>
    </div>
    <div class="card-body">
        <div class="mb-3">
            <strong>Name:</strong> {{ skill.name }}
        </div>
        <div class="mb-3">
            <strong>Added On:</strong> {{ skill.created_at }}
        </div>
    </div>
</div>
{% endblock %}
