{% load common_tags %}
<div class="mb-2" style="overflow-x: auto; white-space: nowrap;">
    <a href="{% url 'super_admin:super_admin_industry_list' %}" 
       class="btn btn-outline-primary
       {% is_active 'super_admin_industry_list' 'super_admin_update_industry' %}">
       Industry List
    </a>

    <a href="{% url 'super_admin:super_admin_functional_area_list' %}" 
       class="btn btn-outline-primary
       {% is_active 'super_admin_functional_area_list' 'super_admin_update_functional_area' %}">
       Functional Area List
    </a>

    <a href="{% url 'super_admin:super_admin_role_list' %}" 
       class="btn btn-outline-primary
       {% is_active 'super_admin_role_list' 'super_admin_update_role' %}">
       Role List
    </a>
    
    <a href="{% url 'super_admin:super_admin_create_industry' %}" 
       class="btn btn-outline-primary
       {% is_active 'super_admin_create_industry' %}">
       Create Industry
    </a>

    <a href="{% url 'super_admin:super_admin_create_functional_area' %}" 
       class="btn btn-outline-primary 
       {% is_active 'super_admin_create_functional_area' %}">
       Create Functional Area
    </a>

    <a href="{% url 'super_admin:super_admin_create_role' %}" 
       class="btn btn-outline-primary 
       {% is_active 'super_admin_create_role' %}">
       Create Role
    </a>
</div>
